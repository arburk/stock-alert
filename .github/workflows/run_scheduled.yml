name: Execute

on:
  workflow_dispatch: # triggered externally by cron, see .github/config/trigger-workflow.sh

jobs:
  execute-current-release:

    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      # `gh release view` without a tag returns the release marked as latest,
      # which excludes drafts and prereleases.
      - name: Get latest release
        id: releaseIdent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release="$(gh release view --json tagName --jq .tagName)"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Download executable v ${{ steps.releaseIdent.outputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ steps.releaseIdent.outputs.release }}
        run: |
          gh release download "$RELEASE" --pattern "stock-alert-$RELEASE.jar" --output "$GITHUB_WORKSPACE/stock-alert.jar"

      - name: Execute
        run: |
          nohup java -jar ${{ github.workspace }}/stock-alert.jar  > ${{ github.workspace }}/stock-alert-execution.log 2>&1 &
          echo $! > app.pid
        env:
          CONFIG-URL: ${{ vars.CONFIG_URL }}
          GATEWAY-EMAIL-HOST: ${{ vars.GATEWAY_EMAIL_HOST }}
          GATEWAY-EMAIL-PORT: ${{ vars.GATEWAY_EMAIL_PORT }}
          GATEWAY-EMAIL-PWD: ${{ secrets.GATEWAY_EMAIL_PWD }}
          GATEWAY-EMAIL-SENDER-ADDRESS: ${{ vars.GATEWAY_EMAIL_SENDER }}
          GATEWAY-EMAIL-USER: ${{ secrets.GATEWAY_EMAIL_USER }}
          S3-ACCESS-KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3-SECRET-KEY: ${{ secrets.S3_SECRET_KEY }}
          S3-ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3-REGION: ${{ vars.S3_REGION }}
          STORAGE: ${{ vars.STORAGE }}
          UPDATE-CRON: "-"
          UPDATE-ON-STARTUP: true
          SUMMARY-FILE: ${{ github.workspace }}/stock-alert-summary.md
          SPRING_APPLICATION_JSON: ${{ vars.SPRING_APPLICATION_JSON}}

      - name: Wait for execution
        run: |
          end=$((SECONDS+60))
          tail -n0 -F ${{ github.workspace }}/stock-alert-execution.log &
          tail_pid=$!
          while [ $SECONDS -lt $end ]; do
            if grep -q "Stock update finished." ${{ github.workspace }}/stock-alert-execution.log; then
              echo "✅ Update finished."
              kill $tail_pid
              exit 0
            fi
            if grep -q "Stock update failed." ${{ github.workspace }}/stock-alert-execution.log; then
              echo "❌ Update failed."
              kill $tail_pid
              exit 1
            fi
            sleep 2
          done
          echo "⏱ Timeout reached"
          kill $tail_pid

      - name: Shutdown app
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/stock-alert-summary.md" ]; then
            cat "${{ github.workspace }}/stock-alert-summary.md" >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "> [!CAUTION]"
              echo "> No summary produced — see run log."
            } >> $GITHUB_STEP_SUMMARY
            grep c.g.a. "${{ github.workspace }}/stock-alert-execution.log" >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f app.pid ]; then
            kill $(cat app.pid)
            rm app.pid
          fi
          if grep -q "Stock update finished." ${{ github.workspace }}/stock-alert-execution.log; then
            exit 0
          else
            exit -1
          fi
          
